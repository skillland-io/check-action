name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass:
    name: Passes a good skill (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./
        with:
          path: test/good-skill
          min-score: 90
          min-area-grade: A
      - name: Check the outputs
        shell: bash
        run: |
          test "${{ steps.check.outputs.score }}" = "100"
          test "${{ steps.check.outputs.grade }}" = "A"
          test "${{ steps.check.outputs.skills }}" = "1"
          test "${{ steps.check.outputs.failed }}" = "0"

  fail:
    name: Fails a bad skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./
        continue-on-error: true
        with:
          path: test
      - name: Check that the step failed
        run: |
          test "${{ steps.check.outcome }}" = "failure"
          test "${{ steps.check.outputs.skills }}" = "2"
          test "${{ steps.check.outputs.failed }}" = "1"
